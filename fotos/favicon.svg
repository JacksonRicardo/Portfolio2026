<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1419"/>
      <stop offset="100%" stop-color="#161d24"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Fundo arredondado estilo terminal/IDE -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#34d399" stroke-width="4" stroke-opacity="0.35"/>
  <!-- Três pontinhos de janela no topo -->
  <circle cx="26" cy="22" r="3.5" fill="#34d399" opacity="0.8"/>
  <circle cx="38" cy="22" r="3.5" fill="#94a3b8" opacity="0.4"/>
  <circle cx="50" cy="22" r="3.5" fill="#94a3b8" opacity="0.25"/>
  <!-- Símbolo prompt ">" e iniciais "JR" -->
  <path d="M22 54 L36 66 L22 78" fill="none" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="44" y="83" font-family="'JetBrains Mono', 'Consolas', monospace" font-weight="800" font-size="44" fill="#f1f5f9" letter-spacing="-1">JR</text>
  <!-- Cursor underscore verde -->
  <rect x="96" y="77" width="14" height="6" rx="2" fill="#34d399"/>
</svg>

